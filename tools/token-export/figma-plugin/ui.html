<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 11px/1.5 Inter, -apple-system, sans-serif;
        margin: 0;
        padding: 12px;
        color: #333;
      }
      h1 {
        font-size: 12px;
        margin: 0 0 8px;
      }
      button {
        font: inherit;
        padding: 5px 10px;
        border-radius: 4px;
        border: 1px solid #ccc;
        background: #f5f5f5;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      textarea {
        width: 100%;
        height: 170px;
        margin-top: 8px;
        box-sizing: border-box;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
      }
      .status {
        margin: 8px 0 0;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Token Export</h1>
    <button id="export">Export variables</button>
    <textarea id="payload" readonly placeholder="The exported JSON appears here."></textarea>
    <button id="copy" disabled>Copy JSON</button>
    <p class="status" id="status">Reads the local variables of this file.</p>

    <script>
      var exportButton = document.getElementById('export');
      var copyButton = document.getElementById('copy');
      var payload = document.getElementById('payload');
      var status = document.getElementById('status');

      exportButton.addEventListener('click', function () {
        status.textContent = 'Reading variables...';
        parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
      });

      copyButton.addEventListener('click', function () {
        payload.focus();
        payload.select();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(payload.value).then(
            function () {
              status.textContent = 'Copied. Now run: pnpm --filter @tokens/export write --file <path>';
            },
            function () {
              document.execCommand('copy');
              status.textContent = 'Copied. Now run: pnpm --filter @tokens/export write --file <path>';
            },
          );
        } else {
          document.execCommand('copy');
          status.textContent = 'Copied. Now run: pnpm --filter @tokens/export write --file <path>';
        }
      });

      window.addEventListener('message', function (event) {
        var message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === 'payload') {
          payload.value = message.json;
          copyButton.disabled = false;
          status.textContent = message.summary;
        }

        if (message.type === 'error') {
          status.textContent = 'Error: ' + message.message;
        }
      });
    </script>
  </body>
</html>
